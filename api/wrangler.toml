name = "vuln-scanner-api"
main = "src/index.ts"
compatibility_date = "2026-07-23"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "scan.illek.ie", custom_domain = true }
]

[assets]
directory = "../web"
binding = "ASSETS"
run_worker_first = true

[vars]
ENVIRONMENT = "production"
# localhost entry exists for `wrangler dev` (browser origin http://localhost:8788).
# It is inert in production CORS because browsers never present that origin
# against scan.illek.ie; remove it only together with a dev-environment override.
ALLOWED_ORIGINS = "https://scan.illek.ie,http://localhost:8788"
REPORT_RETENTION_DAYS = "14"
DAILY_SCAN_LIMIT = "50"
MCP_DAILY_LIMIT = "200"
MAX_PATH_PROBES = "18"
MAX_SCAN_SUBREQUESTS = "46"
MAX_SCAN_CONCURRENCY = "6"
MAX_SCAN_DURATION_MS = "25000"

[triggers]
crons = ["23 4 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "vuln-scanner"
database_id = "790d7b81-47a9-4ec7-b9a8-cd6323610183"

[observability]
enabled = true
head_sampling_rate = 1
