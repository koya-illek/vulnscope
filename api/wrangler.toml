name = "vuln-scanner-api"
main = "src/index.ts"
compatibility_date = "2026-07-23"
# Route every target fetch through Cloudflare's public front door. Without
# this, Workers on illek.ie routes are bypassed and their origin can return
# 403, leaving an otherwise valid scan ungraded. The API rejects self-scans
# before outbound work, so vulnscope.illek.ie and scan.illek.ie cannot loop
# back into this Worker.
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = false
preview_urls = false

# Both names attach to this Worker. vulnscope.illek.ie is the brand host;
# scan.illek.ie stays attached so the Worker can 308 it to the canonical
# origin. `wrangler deploy` from api/ creates/updates both custom domains.
routes = [
  { pattern = "vulnscope.illek.ie", custom_domain = true },
  { pattern = "scan.illek.ie", custom_domain = true }
]

[assets]
directory = "../web"
binding = "ASSETS"
run_worker_first = true

[vars]
ENVIRONMENT = "production"
# api/.dev.vars overrides ENVIRONMENT to "development" for `wrangler dev`,
# disabling the HTTP→HTTPS entry redirect and the scan.illek.ie host
# redirect (see index.ts). wrangler dev also rewrites request URLs and
# Origin headers to a custom-domain host over plain HTTP, so the example
# allowlist includes http://vulnscope.illek.ie and http://scan.illek.ie;
# the localhost entry below is inert in production CORS because browsers
# never present that origin against the public hosts.
# Localhost entry kept for tooling that presents an explicit localhost origin;
# see api/.dev.vars for how `wrangler dev` actually rewrites origins.
ALLOWED_ORIGINS = "https://vulnscope.illek.ie,http://localhost:8788"
REPORT_RETENTION_DAYS = "14"
DAILY_SCAN_LIMIT = "50"
# MCP stays open for testing (no API key) but is stricter than the web form.
MCP_DAILY_LIMIT = "10"
REPORT_DAILY_LIMIT = "80"
MAX_PATH_PROBES = "18"
MAX_SCAN_SUBREQUESTS = "46"
MAX_SCAN_CONCURRENCY = "6"
MAX_SCAN_DURATION_MS = "25000"

[triggers]
crons = ["23 4 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "vuln-scanner"
database_id = "790d7b81-47a9-4ec7-b9a8-cd6323610183"

[observability]
enabled = true
head_sampling_rate = 1
